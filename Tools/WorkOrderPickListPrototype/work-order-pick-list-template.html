  <output id="reportQualification" hidden></output>
  <script>
    const reportData = __REPORT_DATA__;
    const reportParameters = new URLSearchParams(location.search);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const quantity = value => {
      const number = Number(value);
      if (number !== 0 && Math.abs(number) < 0.001) return number.toFixed(4);
      return number.toFixed(3);
    };
    const stamp = new Date(reportData.generatedAt).toLocaleString([], {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const h = reportData.header;
    let selectedView = ['pick', 'grouped', 'vpro', 'raw'].includes(reportParameters.get('view')) ? reportParameters.get('view') : 'pick';
    let printRendering = false;
    const pickEntryState = new Map();

    function paginateRaw(rows) {
      const pages = []; let page = []; let load = 0;
      for (const row of rows) {
        const weight = row.classification === 'MESSAGE' ? 0.72 : 1.2;
        if (page.length && load + weight > 25.5) { pages.push(page); page = []; load = 0; }
        page.push(row); load += weight;
      }
      if (page.length) pages.push(page);
      return pages;
    }

    function parseFindMessage(rawMessage) {
      const raw = String(rawMessage ?? '');
      const numbered = raw.match(/^\((\d+)\)\s*(.*)$/);
      if (!numbered) return {findNumber:null, rawMessage:raw, rawRemainder:raw, references:[], note:'', status:'NOT_NUMBERED'};
      const rawRemainder = numbered[2];
      const referencePattern = rawRemainder.match(/^([A-Za-z]+\d+(?:\s*,\s*(?:[A-Za-z]+\d+|\d+))*)(?:\s+\((.+)\))?$/);
      if (!referencePattern) return {findNumber:Number(numbered[1]), rawMessage:raw, rawRemainder, references:[], note:'', status:'UNRESOLVED'};
      let prefix = '';
      const references = referencePattern[1].split(',').map(token => {
        const clean = token.trim();
        const explicit = clean.match(/^([A-Za-z]+)(\d+)$/);
        if (explicit) { prefix = explicit[1].toUpperCase(); return `${prefix}${explicit[2]}`; }
        return /^\d+$/.test(clean) && prefix ? `${prefix}${clean}` : clean;
      });
      return {findNumber:Number(numbered[1]), rawMessage:raw, rawRemainder, references, note:referencePattern[2] || '', status:referencePattern[2] ? 'PARSED_WITH_NOTE' : 'PARSED'};
    }

    function relatedPartReason(primary, candidate) {
      const primaryCode = String(primary.itemNumber || '').replace(/\s+/g, '').toUpperCase();
      const candidateCode = String(candidate.itemNumber || '').replace(/\s+/g, '').toUpperCase();
      if (Number(candidate.requiredEach) === 0.0001) return 'required-each 0.0001 rule';
      if (primaryCode && candidateCode.startsWith(primaryCode) && candidateCode.length > primaryCode.length) return 'manufacturer-suffix pattern';
      return '';
    }

    function buildGroupedModel(rows) {
      const assemblyInstructions = [];
      const groups = [];
      let active = null;
      for (const row of rows) {
        if (row.classification === 'MESSAGE') {
          if (!active) assemblyInstructions.push(row);
          else active.messageRows.push(row);
          continue;
        }
        const reason = active && active.messageRows.length === 0 ? relatedPartReason(active.primaryPart, row) : '';
        if (reason) {
          active.relatedParts.push({row, relationship:'Probable Alternate / Related Part', reason});
          active.sourceSequences.push(row.sequence);
          continue;
        }
        active = {
          groupId:`G${String(groups.length + 1).padStart(3, '0')}`,
          primaryPart:row,
          relatedParts:[],
          messageRows:[],
          sourceSequences:[row.sequence]
        };
        groups.push(active);
      }
      for (const group of groups) {
        const parsedMessages = group.messageRows.map(row => ({row, parsed:parseFindMessage(row.materialMessage)}));
        const numbered = parsedMessages.filter(entry => entry.parsed.findNumber !== null);
        const primaryMessage = numbered[0] || null;
        group.findNumber = primaryMessage?.parsed.findNumber ?? null;
        group.parsedReferences = primaryMessage?.parsed.references ?? [];
        group.rawReferenceMessage = primaryMessage?.parsed.rawMessage ?? '';
        group.additionalMessages = parsedMessages
          .filter(entry => entry !== primaryMessage)
          .map(entry => entry.row.materialMessage);
        if (primaryMessage?.parsed.note) group.additionalMessages.push(primaryMessage.parsed.note);
        group.requiredEach = group.primaryPart.requiredEach;
        group.totalWorkOrderUnits = group.primaryPart.totalWorkOrderUnits;
        group.sourceSequences.push(...group.messageRows.map(row => row.sequence));
        group.parsingStatus = !primaryMessage || primaryMessage.parsed.status === 'UNRESOLVED' ? 'UNRESOLVED REFERENCE' : primaryMessage.parsed.status.replaceAll('_', ' ');
        group.confidenceStatus = group.parsingStatus === 'UNRESOLVED REFERENCE' ? 'UNRESOLVED' : 'CONFIDENT PARSE';
        group.primarySourceSequence = group.primaryPart.sequence;
        group.primaryPartNumber = group.primaryPart.itemNumber;
        group.primaryDescription = group.primaryPart.description;
        group.primaryUnitOfMeasure = group.primaryPart.unitOfMeasure;
        group.primaryRequiredEach = group.primaryPart.requiredEach;
        group.primaryTotalRequired = group.primaryPart.totalWorkOrderUnits;
        group.groupClassification = group.primaryPart.itemNumber === 'DO NOT POPULATE' ? 'DNP' : Number(group.primaryPart.requiredEach) < 1 ? 'FRACTIONAL' : 'STANDARD';
      }
      return {assemblyInstructions, groups};
    }

    function paginateGroups(groups) {
      const pages = []; let page = []; let load = 0;
      for (const group of groups) {
        const weight = 1.25 + (group.relatedParts.length * 0.35) + (group.additionalMessages.length * 0.2);
        if (page.length && load + weight > 13.4) { pages.push(page); page = []; load = 0; }
        page.push(group); load += weight;
      }
      if (page.length) pages.push(page);
      return pages;
    }

    function paginatePickGroups(groups) {
      const pages = []; let page = []; let load = 0;
      for (const group of groups) {
        const noteCount = group.additionalMessages?.length || 0;
        const weight = 1.05 + (group.relatedParts.length * 0.3) + (noteCount * 0.2) + (group.confidenceStatus === 'UNRESOLVED' ? 0.2 : 0);
        const pageCapacity = pages.length === 0 ? 20 : 26;
        if (page.length && load + weight > pageCapacity) { pages.push(page); page = []; load = 0; }
        page.push(group); load += weight;
      }
      if (page.length) pages.push(page);
      return pages;
    }

    function paginateReplica(rows) {
      const pages = []; let page = []; let load = 0;
      for (const row of rows) {
        const weight = row.classification === 'MESSAGE' ? 0.75 : 1.45;
        if (page.length && load + weight > 31) { pages.push(page); page = []; load = 0; }
        page.push(row); load += weight;
      }
      if (page.length) pages.push(page);
      return pages;
    }

    const field = (label, value) => `<div class="field"><span class="label">${esc(label)}:</span><span class="value">${esc(value)}</span></div>`;
    const rawPages = paginateRaw(reportData.rows);
    const groupedModel = buildGroupedModel(reportData.rows);
    const groupedPages = paginateGroups(groupedModel.groups);
    const pickPages = paginatePickGroups(groupedModel.groups);
    const replicaPages = paginateReplica(reportData.rows);
    const numberedMessageCount = reportData.rows.filter(row => row.classification === 'MESSAGE' && /^\(\d+\)/.test(row.materialMessage || '')).length;
    const unresolvedGroups = groupedModel.groups.filter(group => group.confidenceStatus === 'UNRESOLVED').length;
    const ambiguousGroups = groupedModel.groups.filter(group => group.confidenceStatus === 'AMBIGUOUS').length;
    const probableRelationshipGroups = groupedModel.groups.filter(group => group.relatedParts.length > 0).length;
    const parsedFindNumberGroups = groupedModel.groups.filter(group => group.findNumber !== null).length;
    const groupsWithoutFindNumber = groupedModel.groups.length - parsedFindNumberGroups;
    const ambiguousPickGroups = groupedModel.groups.filter(group => group.confidenceStatus === 'AMBIGUOUS').length;

    function backToWorkOrder() {
      const sameOriginReferrer = (() => {
        try { return document.referrer && new URL(document.referrer).origin === location.origin; }
        catch (_error) { return false; }
      })();
      if (reportParameters.get('source') === '5051-kitting' && sameOriginReferrer && history.length > 1) {
        history.back();
        return;
      }
      const returnPath = reportParameters.get('return') || '/';
      location.assign(returnPath.startsWith('/') && !returnPath.startsWith('//') ? returnPath : '/');
    }

    function prepareKittingPrint() {
      if (selectedView !== 'pick' || document.body.classList.contains('print-preview') || printRendering) return;
      printRendering = true;
      document.body.classList.add('print-rendering');
      renderReport();
      const qualificationOutput = document.getElementById('reportQualification');
      qualificationOutput.dataset.lastPrintPageCount = String(document.querySelectorAll('.pick-sheet').length);
      qualificationOutput.dataset.lastPrintPicked = document.querySelector('.pick-picked-input')?.value || '';
      qualificationOutput.dataset.lastPrintShort = document.querySelector('.pick-short-input')?.value || '';
      qualificationOutput.dataset.lastPrintPo = document.querySelector('.pick-po-input')?.value || '';
    }

    function restoreKittingScreen() {
      if (!printRendering) return;
      printRendering = false;
      document.body.classList.remove('print-rendering');
      renderReport();
    }

    function printReleasedBom() {
      prepareKittingPrint();
      window.print();
      setTimeout(restoreKittingScreen, 500);
    }

    function setReportView(view) {
      selectedView = ['pick', 'grouped', 'vpro', 'raw'].includes(view) ? view : 'pick';
      reportParameters.set('view', selectedView);
      history.replaceState(null, '', `${location.pathname}?${reportParameters.toString()}${location.hash}`);
      renderReport();
    }

    function reportHeader(pageNumber, pageCount, viewLabel) {
      return `<div class="company">${esc(h.company)}</div>
        <h1>WORK ORDER RELEASED BOM</h1>
        <div class="top-rule"></div>
        <section class="header-grid">
          ${field('Work Order', h.workOrder)} ${field('Bill Number', h.billNumber)} ${field('Customer', h.customer)}
          ${field('Type', h.type)} ${field('Description', h.description)} ${field('Customer No.', h.customerNumber)}
          ${field('Status', h.status)} ${field('Drawing / Rev', `${h.drawing} / ${h.revision}`)} ${field('Sales Order', `${h.salesOrder}  Line ${h.salesOrderLine}`)}
          ${field('Category', h.category)} ${field('Scheduled Production', quantity(h.scheduledProduction))} ${field('Customer PO', h.customerPurchaseOrder)}
          ${field('Warehouse', h.warehouse)} ${field('Yield / UM', `${Number(h.yield).toFixed(1)}% / ${h.unitOfMeasure}`)} ${field('Open Date', h.openDate)}
        </section>
        <div class="runtime-line"><span>DLE-OS GENERATED: ${esc(stamp)} · DEVELOPMENT ONLY · <span class="view-label">${esc(viewLabel)}</span></span><span>PAGE ${pageNumber} OF ${pageCount}</span></div>`;
    }

    function componentRow(row) {
      return `<tr class="component" data-sequence="${esc(row.sequence)}">
        <td>${esc(row.sequence)}</td><td>${esc(row.itemNumber)}</td><td class="description">${esc(row.description || '*** NOT ON FILE ***')}</td>
        <td>${esc(row.unitOfMeasure)}</td><td>${esc(row.requiredDate)}</td><td class="num">${quantity(row.requiredEach)}</td>
        <td class="num">${quantity(row.scrapFactor)}</td><td class="num">${quantity(row.alternateFactor)}</td><td class="num">${quantity(row.totalWorkOrderUnits)}</td>
      </tr>`;
    }

    function messageRow(row) {
      return `<tr class="message" data-sequence="${esc(row.sequence)}"><td>${esc(row.sequence)}</td><td colspan="8" class="message-text"><span class="type-tag">MESSAGE&nbsp;</span>${esc(row.materialMessage)}</td></tr>`;
    }

    function rawSourceProof() {
      return `<div class="source-proof">ROW CONTROL: ${reportData.counts.total} TOTAL · ${reportData.counts.component} COMPONENT · ${reportData.counts.message} MESSAGE · ${reportData.counts.unresolved} UNRESOLVED<br>O_RDONLY · ZERO SOURCE WRITES · ZERO SOURCE LOCKS · PREFIX ${esc(reportData.sourceIdentity.prefixText)}</div>`;
    }

    function renderRaw() {
      return rawPages.map((rows, index) => `<article class="sheet">
        ${reportHeader(index + 1, rawPages.length, 'RAW SOURCE VIEW')}
        <table aria-label="Work Order 0115621 raw source material requirements">
          <colgroup><col class="seq"><col class="item"><col class="desc"><col class="um"><col class="date"><col class="qty"><col class="qty"><col class="qty"><col class="qty"></colgroup>
          <thead><tr><th>Seq</th><th>Item Code</th><th>Description / Material Message</th><th>UM</th><th>Req Date</th><th class="num">Each</th><th class="num">Scrap</th><th class="num">Alt</th><th class="num">Total Units</th></tr></thead>
          <tbody>${rows.map(row => row.classification === 'MESSAGE' ? messageRow(row) : componentRow(row)).join('')}</tbody>
        </table>
        ${index === rawPages.length - 1 ? rawSourceProof() : ''}
        <footer class="sheet-footer"><span>Source: ${esc(reportData.sourceLabel)}</span><span>Page ${index + 1} of ${rawPages.length}</span></footer>
      </article>`).join('');
    }

    function replicaEach(value) {
      const number = Number(value);
      if (Number.isInteger(number)) return String(number);
      return number.toFixed(4).replace(/^0/, '').replace(/0+$/, '').replace(/\.$/, '');
    }

    function replicaTotal(value) {
      const number = Number(value);
      return number.toFixed(4).replace(/^0(?=\.)/, '');
    }

    const replicaField = (label, value) => `<div class="replica-field"><span class="replica-label">${esc(label)}:</span><span>${esc(value)}</span></div>`;

    function replicaHeader(pageNumber) {
      const generated = new Date(reportData.generatedAt);
      const generatedDate = generated.toLocaleDateString([], {month:'2-digit',day:'2-digit',year:'2-digit'});
      const generatedTime = generated.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      return `<header class="replica-report-header">
        <div class="replica-identity">
          <div class="generated">${esc(generatedDate)}<br>${esc(generatedTime)}</div>
          <div class="replica-title"><strong>De Leon Enterprises</strong><span>Released Work Order BOM</span></div>
          <div class="replica-page">Page&nbsp;&nbsp;${pageNumber}</div>
        </div>
        <section class="replica-header" aria-label="Work Order report header">
          <div class="replica-header-column">
            ${replicaField('Work Order Number', h.workOrder)}
            ${replicaField('Bill Number', h.billNumber)}
            ${replicaField('Description', h.description)}
            ${replicaField('Prod Qty', quantity(h.scheduledProduction))}
            ${replicaField('Warehouse Code', h.warehouse)}
            ${replicaField('Drawing Number', h.drawing)}
            ${replicaField('Drawing Revision', h.revision)}
          </div>
          <div class="replica-header-column">
            ${replicaField('Unit of Measure', h.unitOfMeasure)}
            ${replicaField('Estimated Yield %', Number(h.yield).toFixed(2))}
            ${replicaField('Revision Code', h.revision)}
            ${replicaField('Open Date', h.openDate)}
            ${replicaField('As Of', generatedDate)}
          </div>
        </section>
        <div class="replica-columns" role="row">
          <span>Seq</span><span>Location</span><span>Component</span><span>U/M</span><span>CompQty</span><span>Prod Qty</span><span>Picked</span><span>Short</span>
        </div>
      </header>`;
    }

    function replicaComponent(row) {
      return `<div class="replica-row component" data-sequence="${esc(row.sequence)}" data-row-classification="COMPONENT">
        <div class="replica-component-line">
          <span>${esc(row.sequence)}</span><span aria-label="Location not qualified"></span><span class="part">${esc(row.itemNumber)}</span><span>${esc(row.unitOfMeasure)}</span>
          <span>[${esc(replicaEach(row.requiredEach))}]</span><span>${esc(replicaTotal(row.totalWorkOrderUnits))}</span><span><i class="write-line" aria-hidden="true"></i></span><span><i class="write-line" aria-hidden="true"></i></span>
        </div>
        <div class="replica-description">${esc(row.description || '*** NOT ON FILE ***')}</div>
      </div>`;
    }

    function replicaMessage(row) {
      return `<div class="replica-row replica-message" data-sequence="${esc(row.sequence)}" data-row-classification="MESSAGE">${esc(row.materialMessage)}</div>`;
    }

    function replicaSignoff() {
      return `<section class="replica-signoff" aria-label="Printed signoff lines">
        <div><span>Assembled</span><span class="sign-line"></span></div>
        <div><span>Checked</span><span class="sign-line"></span></div>
        <div><span>Packed</span><span class="sign-line"></span></div>
      </section>`;
    }

    function renderReplica() {
      return replicaPages.map((rows, index) => `<article class="sheet replica-sheet" data-page-number="${index + 1}">
        ${replicaHeader(index + 1)}
        <div class="replica-body" aria-label="Work Order 0115621 VPro-style source rows">
          ${rows.map(row => row.classification === 'MESSAGE' ? replicaMessage(row) : replicaComponent(row)).join('')}
        </div>
        ${index === replicaPages.length - 1 ? replicaSignoff() : ''}
        <footer class="sheet-footer"><span class="replica-source-note">VPro-style replica generated by DLE-OS from stored Work Order material requirements.</span><span>Page ${index + 1} of ${replicaPages.length}</span></footer>
      </article>`).join('');
    }

    function pickRequired(value) {
      const number = Number(value);
      if (Number.isInteger(number)) return String(number);
      if (Math.abs(number) < 1) return number.toFixed(3);
      return number.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
    }

    function pickQuantityPerAssembly(value) {
      const number = Number(value);
      if (Number.isInteger(number)) return String(number);
      const precision = Math.abs(number) < 0.001 ? 4 : 3;
      return number.toFixed(precision).replace(/0+$/, '').replace(/\.$/, '');
    }

    function pickMessageRemainder(rawMessage) {
      return String(rawMessage || '').replace(/^\(\d+\)\s*/, '').trim();
    }

    function pickNotes(group) {
      const notes = [...group.additionalMessages];
      if (!group.parsedReferences.length && group.rawReferenceMessage) notes.unshift(pickMessageRemainder(group.rawReferenceMessage));
      return [...new Set(notes.filter(Boolean))];
    }

    function pickContextField(label, value, prominent = false) {
      return `<span class="pick-context-label">${esc(label)}</span><span class="pick-context-value${prominent ? ' prominent' : ''}">${esc(value)}</span>`;
    }

    function pickHeader(pageNumber, pageCount = pickPages.length, screenPresentation = false) {
      if (pageNumber > 1) {
        return `<header class="pick-header pick-continuation-header">
          <div class="pick-continuation-title"><span>DE LEON ENTERPRISES — KITTING PICK LIST</span><span>PAGE ${pageNumber} OF ${pageCount}</span></div>
          <div class="pick-continuation-fields" aria-label="Continuation packet identity">
            <span><strong>WO:</strong> ${esc(h.workOrder)}</span>
            <span><strong>Assembly:</strong> ${esc(h.billNumber)} Rev ${esc(h.revision)}</span>
            <span><strong>Customer:</strong> ${esc(h.customer)}</span>
            <span><strong>SO:</strong> ${esc(h.salesOrder)} / Line ${esc(h.salesOrderLine)}</span>
            <span><strong>Customer P.O.:</strong> ${esc(h.customerPurchaseOrder)}</span>
          </div>
        </header>`;
      }
      return `<header class="pick-header">
        <div class="pick-title-row"><h1>KITTING PICK VIEW</h1>${screenPresentation ? '' : `<div class="pick-page">PAGE ${pageNumber} OF ${pageCount}</div>`}</div>
        <section class="pick-context" aria-label="Work Order and customer order context">
          <div class="pick-context-section">
            <div class="pick-context-heading">WORK ORDER / BUILD</div>
            ${pickContextField('Work Order', h.workOrder, true)}
            ${pickContextField('Assembly', h.billNumber, true)}
            ${pickContextField('Revision', h.revision)}
            ${pickContextField('Description', h.description)}
            ${pickContextField('Build Qty', `${pickRequired(h.scheduledProduction)} ${h.unitOfMeasure}`)}
            ${pickContextField('Warehouse', h.warehouse)}
            ${pickContextField('Open Date', h.openDate)}
          </div>
          <div class="pick-context-section">
            <div class="pick-context-heading">CUSTOMER / ORDER</div>
            ${pickContextField('Customer', h.customer, true)}
            ${pickContextField('Customer No.', h.customerNumber)}
            ${pickContextField('Sales Order', h.salesOrder, true)}
            ${pickContextField('SO Line', h.salesOrderLine)}
            ${pickContextField('Customer P.O.', h.customerPurchaseOrder, true)}
          </div>
        </section>
        <section class="pick-order-schedule" aria-label="Order Schedule">
          <h2>${esc(reportData.orderScheduleAssessment.title)}</h2>
          <table><colgroup><col class="schedule-line"><col class="schedule-item"><col class="schedule-qty"><col class="schedule-date"></colgroup>
            <thead><tr><th>SO Line</th><th>Item</th><th class="num">Qty Ordered</th><th>Estimated Ship</th></tr></thead>
            <tbody>${reportData.orderSchedule.map(row => `<tr><td>${esc(row.salesOrderLine)}</td><td>${esc(row.itemNumber)}</td><td class="num">${esc(pickRequired(row.quantityOrdered))} ${esc(row.unitOfMeasure)}</td><td>${esc(row.estimatedShip)}</td></tr>`).join('')}</tbody>
          </table>
        </section>
        <div class="pick-local-note">DEVELOPMENT ONLY · Component P.O. = unverified DLE purchasing entry for material traceability · Entry values are not calculated or saved</div>
      </header>`;
    }

    function updateSessionEntry(input) {
      if (input.type === 'number' && input.value !== '' && input.valueAsNumber < 0) input.value = '';
      input.setAttribute('value', input.value);
      pickEntryState.set(`${input.dataset.entryKind}:${input.dataset.woSequence}`, input.value);
    }

    function pickEntryValue(kind, sequence) {
      return esc(pickEntryState.get(`${kind}:${sequence}`) || '');
    }

    function pickGroupRow(group) {
      const relatedParts = group.relatedParts.map(part => `<span class="pick-related">${esc(part.row.itemNumber)}</span>`).join('');
      const relatedSequences = group.relatedParts.map(part => `<span class="pick-related-sequence">${esc(part.row.sequence)}</span>`).join('');
      const references = group.parsedReferences.length ? group.parsedReferences.join(', ') : '—';
      const notes = pickNotes(group);
      const isDnp = group.groupClassification === 'DNP';
      const relationshipReview = group.confidenceStatus === 'AMBIGUOUS' ? '<span class="pick-note">Relationship needs review</span>' : '';
      return `<tr class="pick-group" data-group-id="${esc(group.groupId)}" data-source-sequences="${esc(group.sourceSequences.join(','))}" data-group-classification="${esc(group.groupClassification)}">
        <td><span class="pick-sequence">${esc(group.primarySourceSequence)}</span>${relatedSequences ? `<span class="pick-related-sequences" aria-label="Related component sequences">${relatedSequences}</span>` : ''}</td>
        <td><span class="pick-find-number">${esc(group.findNumber ?? '—')}</span></td>
        <td><span class="pick-primary">${esc(group.primaryPartNumber)}</span>${relatedParts ? `<span class="pick-related-label">Related / MFR Part</span>${relatedParts}` : ''}${relationshipReview}</td>
        <td class="pick-details">${esc(group.primaryDescription || '*** NOT ON FILE ***')}${isDnp ? '<span class="pick-dnp">DNP</span>' : ''}<span class="pick-refs">Refs: ${esc(references)}</span>${notes.length ? `<span class="pick-note">Note: ${esc(notes.join(' · '))}</span>` : ''}</td>
        <td class="pick-required"><span class="pick-required-layout"><span class="pick-qty-assy">[${esc(pickQuantityPerAssembly(group.primaryRequiredEach))}]</span><span class="pick-required-total">${esc(pickRequired(group.primaryTotalRequired))} ${esc(group.primaryUnitOfMeasure)}</span></span></td>
        <td class="pick-write-cell"><input class="pick-entry-input pick-quantity-input pick-picked-input" type="number" inputmode="decimal" min="0" step="any" value="${pickEntryValue('picked', group.primarySourceSequence)}" autocomplete="off" aria-label="Picked quantity for WO sequence ${esc(group.primarySourceSequence)}, find ${esc(group.findNumber ?? 'unassigned')}" data-entry-kind="picked" data-wo-sequence="${esc(group.primarySourceSequence)}" data-find-number="${esc(group.findNumber ?? '')}" oninput="updateSessionEntry(this)"></td>
        <td class="pick-write-cell"><input class="pick-entry-input pick-quantity-input pick-short-input" type="number" inputmode="decimal" min="0" step="any" value="${pickEntryValue('short', group.primarySourceSequence)}" autocomplete="off" aria-label="Short quantity for WO sequence ${esc(group.primarySourceSequence)}, find ${esc(group.findNumber ?? 'unassigned')}" data-entry-kind="short" data-wo-sequence="${esc(group.primarySourceSequence)}" data-find-number="${esc(group.findNumber ?? '')}" oninput="updateSessionEntry(this)"></td>
        <td class="pick-write-cell"><input class="pick-entry-input pick-po-input" type="text" size="10" maxlength="20" value="${pickEntryValue('po', group.primarySourceSequence)}" autocomplete="off" aria-label="Purchase order for WO sequence ${esc(group.primarySourceSequence)}, find ${esc(group.findNumber ?? 'unassigned')}" data-entry-kind="po" data-wo-sequence="${esc(group.primarySourceSequence)}" data-find-number="${esc(group.findNumber ?? '')}" oninput="updateSessionEntry(this)"></td>
      </tr>`;
    }

    function pickTable(groups) {
      return `<table class="pick-table" aria-label="Work Order 0115621 logical Kitting pick groups">
        <colgroup><col class="pick-seq"><col class="pick-find"><col class="pick-part"><col class="pick-detail"><col class="pick-required"><col class="pick-write"><col class="pick-write"><col class="pick-po"></colgroup>
        <thead><tr><th>WO Seq</th><th>Find</th><th>Part / Related Part</th><th>Description / References</th><th class="num"><span class="pick-required-heading"><span class="pick-qty-assy-heading">Qty/Assy</span><span>Required</span></span></th><th>Picked</th><th>Short</th><th>P.O.</th></tr></thead>
        <tbody>${groups.map(pickGroupRow).join('')}</tbody>
      </table>`;
    }

    function renderKittingPick() {
      const paginated = document.body.classList.contains('print-preview') || printRendering;
      if (!paginated) {
        return `<article class="sheet pick-sheet pick-screen-sheet">
          ${pickHeader(1, 1, true)}
          <section class="pick-instructions"><h2>Assembly Instructions</h2>${groupedModel.assemblyInstructions.map(row => `<p>${esc(row.materialMessage)}</p>`).join('')}</section>
          <div class="pick-screen-scroll" role="region" aria-label="Scrollable Kitting pick report table" tabindex="0">${pickTable(groupedModel.groups)}</div>
          <footer class="sheet-footer"><span>Logical groups derived in memory from the qualified 100-row Released BOM</span><span>Continuous screen report</span></footer>
        </article>`;
      }
      return pickPages.map((groups, index) => `<article id="pick-page-${index + 1}" class="sheet pick-sheet" data-page-number="${index + 1}">
        ${pickHeader(index + 1)}
        ${index === 0 ? `<section class="pick-instructions"><h2>Assembly Instructions</h2>${groupedModel.assemblyInstructions.map(row => `<p>${esc(row.materialMessage)}</p>`).join('')}</section>` : ''}
        ${pickTable(groups)}
        <footer class="sheet-footer"><span>Logical groups derived in memory from the qualified 100-row Released BOM</span><span>Page ${index + 1} of ${pickPages.length}</span></footer>
      </article>`).join('');
    }

    function groupedRow(group) {
      const related = group.relatedParts.length ? group.relatedParts.map(part => `<span class="related-part">${esc(part.row.itemNumber)}</span><span class="probable-label">Probable Alternate / Related Part</span>`).join('<br>') : '—';
      const refs = group.parsedReferences.length ? group.parsedReferences.join(', ') : 'Unresolved — see raw message';
      const notes = [
        `Group ${group.groupId} · Source seq ${group.sourceSequences.join(', ')} · <span class="parse-status ${group.confidenceStatus === 'UNRESOLVED' ? 'unresolved' : ''}">${esc(group.parsingStatus)}</span>`,
        group.rawReferenceMessage ? `<span class="raw-message">Raw: ${esc(group.rawReferenceMessage)}</span>` : '',
        group.additionalMessages.length ? `<span class="raw-message">Additional: ${esc(group.additionalMessages.join(' · '))}</span>` : ''
      ].filter(Boolean).join('');
      return `<tr class="group-main" data-group-id="${group.groupId}" data-primary-sequence="${esc(group.primaryPart.sequence)}" data-source-sequences="${esc(group.sourceSequences.join(','))}" data-confidence="${esc(group.confidenceStatus)}">
        <td>${group.findNumber ?? '—'}</td>
        <td class="primary-part">${esc(group.primaryPart.itemNumber)}</td>
        <td>${related}</td>
        <td>${esc(group.primaryPart.description || '*** NOT ON FILE ***')}</td>
        <td class="num">${quantity(group.requiredEach)}</td>
        <td class="num">${quantity(group.totalWorkOrderUnits)}</td>
        <td class="refs-list">${esc(refs)}</td>
      </tr><tr class="group-notes"><td colspan="7">${notes}</td></tr>`;
    }

    function renderGrouped() {
      return groupedPages.map((groups, index) => `<article class="sheet">
        ${reportHeader(index + 1, groupedPages.length, 'GROUPED OPERATOR VIEW')}
        ${index === 0 ? `<section class="assembly-instructions"><h2>Assembly Instructions</h2>${groupedModel.assemblyInstructions.map(row => `<p><span class="sequence">SEQ ${esc(row.sequence)}</span>${esc(row.materialMessage)}</p>`).join('')}</section>` : ''}
        <table class="grouped-table" aria-label="Work Order 0115621 grouped operator released BOM">
          <colgroup><col class="find"><col class="primary"><col class="related"><col class="group-description"><col class="group-qty"><col class="group-qty"><col class="refs"></colgroup>
          <thead><tr><th>Find</th><th>Primary Part</th><th>Related / Probable Alternate</th><th>Description</th><th class="num">Each</th><th class="num">WO Total</th><th>Refs</th></tr></thead>
          <tbody>${groups.map(groupedRow).join('')}</tbody>
        </table>
        ${index === groupedPages.length - 1 ? `<div class="source-proof">DERIVED CONTROL: ${groupedModel.groups.length} GROUPS · ${numberedMessageCount} FIND-NUMBER MESSAGES · ${groupedModel.assemblyInstructions.length} ASSEMBLY INSTRUCTIONS · ${unresolvedGroups} UNRESOLVED · ${ambiguousGroups} AMBIGUOUS · ${probableRelationshipGroups} PROBABLE RELATIONSHIP GROUPS<br>${rawSourceProof().replace(/^<div class="source-proof">|<\/div>$/g, '')}</div>` : ''}
        <footer class="sheet-footer"><span>Derived in memory from qualified ${reportData.counts.total}-row source · no reload</span><span>Page ${index + 1} of ${groupedPages.length}</span></footer>
      </article>`).join('');
    }

    function renderReport() {
      const pick = selectedView === 'pick';
      const grouped = selectedView === 'grouped';
      const replica = selectedView === 'vpro';
      const raw = selectedView === 'raw';
      document.getElementById('report').innerHTML = pick ? renderKittingPick() : grouped ? renderGrouped() : replica ? renderReplica() : renderRaw();
      document.getElementById('kittingPickView').classList.toggle('active', pick);
      document.getElementById('groupedOperatorView').classList.toggle('active', grouped);
      document.getElementById('vproReplicaView').classList.toggle('active', replica);
      document.getElementById('rawSourceView').classList.toggle('active', raw);
      document.getElementById('kittingPickView').setAttribute('aria-pressed', String(pick));
      document.getElementById('groupedOperatorView').setAttribute('aria-pressed', String(grouped));
      document.getElementById('vproReplicaView').setAttribute('aria-pressed', String(replica));
      document.getElementById('rawSourceView').setAttribute('aria-pressed', String(raw));
      document.body.dataset.viewLabel = pick ? 'KITTING PICK VIEW' : grouped ? 'GROUPED OPERATOR VIEW' : replica ? 'VPRO REPLICA VIEW' : 'RAW SOURCE VIEW';
      document.body.dataset.reportView = selectedView;
    }

    const qualification = document.getElementById('reportQualification');
    Object.assign(qualification.dataset, {
      rawTotal:reportData.counts.total,
      rawComponent:reportData.counts.component,
      rawMessage:reportData.counts.message,
      groupCount:groupedModel.groups.length,
      findNumberMessageCount:numberedMessageCount,
      assemblyInstructionCount:groupedModel.assemblyInstructions.length,
      unresolvedGroupCount:unresolvedGroups,
      ambiguousGroupCount:ambiguousGroups,
      probableRelationshipGroupCount:probableRelationshipGroups,
      pickGroupCount:groupedModel.groups.length,
      pickRelatedGroupCount:probableRelationshipGroups,
      pickParsedFindCount:parsedFindNumberGroups,
      pickMissingFindCount:groupsWithoutFindNumber,
      pickAmbiguousGroupCount:ambiguousPickGroups,
      replicaPageCount:replicaPages.length,
      replicaSourceRowCount:replicaPages.reduce((count, rows) => count + rows.length, 0)
    });
    if (reportParameters.get('print') === '1') document.body.classList.add('print-preview');
    addEventListener('beforeprint', prepareKittingPrint);
    addEventListener('afterprint', restoreKittingScreen);
    renderReport();
  </script>
</body>
</html>
