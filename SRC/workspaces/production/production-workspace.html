<div class="production-workspace" data-production-workspace>
  <header class="production-workspace-header">
    <div>
      <h1>Production</h1>
      <p>Open a job to view its released instructions.</p>
    </div>
    <div id="productionWorkspaceStatus" class="production-workspace-status" role="status" aria-live="polite">Loading jobs</div>
  </header>

  <div data-production-queue-view>
  <section class="production-workspace-controls" aria-label="Production queue controls">
    <label class="production-search-control">
      <span class="sr-only">Search Production jobs</span>
      <input id="productionWorkspaceSearch" type="search" autocomplete="off"
        placeholder="Search Work Order, Part, Customer, PO...">
    </label>
    <label class="production-filter">Material status<select id="productionQueueFilter"><option value="ALL">All jobs</option><option value="KIT_COMPLETE">Kit Complete</option><option value="KIT_SHORT">Kit Short</option></select></label>
    <button id="productionWorkspaceRefresh" type="button" class="secondary-btn production-refresh">↻ Refresh Queue</button>
  </section>

  <section class="production-operator-queue" aria-labelledby="productionSelectedQueueTitle">
    <h2 id="productionSelectedQueueTitle">Production jobs</h2>
    <p id="productionSelectedQueueDescription">Select a work order to open its released slides.</p>
    <div id="productionSelectedJobs" class="production-job-list"></div>
  </section>
  </div>
  <section id="productionManagement" class="production-management" aria-label="Production management" hidden></section>
</div>
