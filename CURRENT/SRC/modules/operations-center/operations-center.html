<!-- =====================================================
   460 - HTML: OPERATIONS CENTER MODULE
===================================================== -->

<section id="operationsCenter" class="screen" data-module-loaded="true">
  <div class="operations-center-panel">
    <div class="operations-center-header">
      <div class="operations-center-title">
        <span class="small-icon">OC</span>
        <div>
          <h2>Operations Center</h2>
          <p>Daily operational workspace built from Master Data and Operations Overlay notes.</p>
        </div>
      </div>

      <div class="operations-center-toolbar">
        <input
          type="text"
          id="operationsCenterSearch"
          class="operations-center-search"
          placeholder="Search customer, PO, sales order, work order, item, notes..."
          onkeyup="filterOperationsCenter()">
        <button type="button" onclick="renderOperationsCenterModule()">Refresh</button>
        <button id="operationsCenterSaveButton" type="button" onclick="saveOperationsCenterOverlay()">Save</button>
      </div>
    </div>

    <div class="operations-center-status-row">
      <div id="operationsCenterStatus" class="operations-center-status">Operations Center initializing.</div>
      <div id="operationsCenterSaveStatus" class="operations-center-save-status">No unsaved changes.</div>
    </div>

    <div id="operationsCenterTable" class="operations-center-table-wrap">
      <div class="operations-center-empty">Load Master Data from System Center to view Operations Center.</div>
    </div>
  </div>
</section>
